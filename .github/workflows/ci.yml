name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
