name: Bug report
description: Report something that does not work
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command you ran
      render: sh
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: The output, including the exit code
      description: Paste stdout, stderr and the value of `echo $?`.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `termshot --version`.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Output of `termshot config`, run in the same folder. It shows the shell and every other setting.
      render: json
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: For example `macOS 15.3 on Apple silicon`.
    validations:
      required: true
